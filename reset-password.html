<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - FocusUp</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .success {
      background: #e8f7ee;
      color: #18794e;
    }

    .error {
      background: #fdecec;
      color: #b42318;
    }

    .support {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #666;
    }

    .support a {
      color: #4f46e5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">FocusUp</div>

  <div class="subtitle">
    Create a new password
  </div>

  <form id="resetForm">

    <label for="password">
      New Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter new password"
      minlength="8"
      required
    >

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      minlength="8"
      required
    >

    <button id="resetButton" type="submit">
      Reset Password
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="support">
    Need help?
    <a href="mailto:focusupgen3@gmail.com">
      Contact FocusUp Support
    </a>
  </div>

</div>

<script>

  // ============================================
  // FOCUSUP SUPABASE CONFIGURATION
  // ============================================

  const SUPABASE_URL =
    "https://gixaxwlucahtxqrebrzw.supabase.co";

  const SUPABASE_ANON_KEY =
    sb_publishable_1XXzEh6gVKpfonrLsGCyYg_iOtWRnvQ
  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ============================================
  // UI
  // ============================================

  const form =
    document.getElementById("resetForm");

  const password =
    document.getElementById("password");

  const confirmPassword =
    document.getElementById("confirmPassword");

  const button =
    document.getElementById("resetButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  // ============================================
  // CHECK RECOVERY SESSION
  // ============================================

  async function checkRecoverySession() {

    try {

      const hash =
        window.location.hash;

      const query =
        window.location.search;

      /*
       * Supabase may return the recovery information
       * through the URL hash/query parameters.
       */

      if (
        !hash &&
        !query
      ) {
        showMessage(
          "This password reset link is invalid or has expired.",
          "error"
        );
      }

    } catch (error) {

      console.error(error);

      showMessage(
        "Unable to verify the password reset link.",
        "error"
      );
    }
  }


  // ============================================
  // PASSWORD RESET
  // ============================================

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const newPassword =
        password.value;

      const confirm =
        confirmPassword.value;


      // Password length

      if (newPassword.length < 8) {

        showMessage(
          "Password must be at least 8 characters.",
          "error"
        );

        return;
      }


      // Password match

      if (newPassword !== confirm) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        "Updating...";


      try {

        const {
          data,
          error
        } = await supabaseClient.auth.updateUser({
          password: newPassword
        });


        if (error) {

          console.error(error);

          if (
            error.message
              .toLowerCase()
              .includes("expired")
          ) {

            showMessage(
              "This password reset link has expired. Please request a new one from the FocusUp app.",
              "error"
            );

          } else {

            showMessage(
              error.message,
              "error"
            );
          }

          return;
        }


        // ========================================
        // SUCCESS
        // ========================================

        showMessage(
          "Password updated successfully! You can now return to FocusUp and sign in with your new password.",
          "success"
        );

        form.reset();


        button.textContent =
          "Password Updated";

      } catch (error) {

        console.error(error);

        showMessage(
          "Something went wrong. Please try again.",
          "error"
        );

      } finally {

        button.disabled = false;

      }

    }
  );


  // Start

  checkRecoverySession();

</script>

</body>
</html>
